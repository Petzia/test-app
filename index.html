<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="Doodle Jump : saute de plateforme en plateforme, le plus haut possible.">
  <meta name="theme-color" content="#f9f5e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Doodle Jump">
  <title>Doodle Jump</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage" class="stage">
    <canvas id="game" tabindex="0" role="img" aria-label="Jeu Doodle Jump"></canvas>

    <div id="hud" class="hud" hidden>
      <span id="score" class="score" aria-live="off">0</span>
      <div class="hud-buttons">
        <button id="sound" type="button" class="icon-btn" aria-label="Couper le son">🔊</button>
        <button id="pause" type="button" class="icon-btn" aria-label="Pause">⏸</button>
      </div>
    </div>

    <section id="menu" class="screen">
      <h1 class="title">doodle<br>jump</h1>
      <button id="play" type="button" class="btn">Jouer</button>
      <button id="control" type="button" class="btn secondary">Contrôle</button>
      <p id="control-help" class="help"></p>
      <p class="best">Record : <span id="menu-best">0</span></p>
    </section>

    <section id="paused" class="screen" hidden>
      <h2 class="title small">pause</h2>
      <button id="resume" type="button" class="btn">Reprendre</button>
      <button id="quit" type="button" class="btn secondary">Menu</button>
    </section>

    <section id="gameover" class="screen" hidden>
      <h2 class="title small">game over!</h2>
      <p class="result">Score : <strong id="over-score">0</strong></p>
      <p class="result">Record : <strong id="over-best">0</strong></p>
      <p id="new-record" class="record" hidden>🎉 Nouveau record !</p>
      <button id="again" type="button" class="btn">Rejouer</button>
      <button id="to-menu" type="button" class="btn secondary">Menu</button>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
