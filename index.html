<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Doodle Jump Lite</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Doodle Jump Lite</h1>
    <p class="hud">Score: <span id="score">0</span> · Best: <span id="best">0</span></p>
    <div class="stage">
      <canvas id="game" tabindex="0" aria-label="Game area: use the left and right arrow keys, or tap the left or right half on mobile"></canvas>
      <div id="overlay" class="overlay">
        <p id="overlay-text">Jump from platform to platform. Don't fall!</p>
        <button id="start" type="button">Play</button>
      </div>
    </div>
    <p class="help">← → or A / D to move · tap left / right on mobile</p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
